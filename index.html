
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 1.5rem;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .btn-enviar { background-color: #28a745; color: white; grid-column: span 2; }
        .btn-salir { background-color: #dc3545; color: white; }
        .btn-limpiar { background-color: #6c757d; color: white; }
        .btn-ver { background-color: #007bff; color: white; grid-column: span 2; text-decoration: none; text-align: center; padding: 10px; border-radius: 4px; display: block; }
        button:hover, .btn-ver:hover { opacity: 0.85; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #mensajeEstado {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Registro de 4to.</h2>
    <form id="miFormulario">
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" required>
        </div>
        <div class="form-group">
            <label>Apellido</label>
            <input type="text" name="apellido" required>
        </div>
        <div class="form-group">
            <label>Dirección</label>
            <input type="text" name="direccion">
        </div>
        <div class="form-group">
            <label>Cédula</label>
            <input type="text" name="cedula">
        </div>
        <div class="form-group">
            <label>Nacionalidad</label>
            <input type="text" name="nacionalidad">
        </div>
        <div class="button-group">
            <button type="submit" class="btn-enviar">Enviar</button>
            <button type="button" class="btn-salir" onclick="window.close()">Salir</button>
            <button type="reset" class="btn-limpiar">Limpiar</button>
            <a href="datos.html" class="btn-ver">Ver registros</a>
        </div>
        <div id="mensajeEstado"></div>
    </form>
</div>

<script type="module">
    // === IMPORTAR FIREBASE ===
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // === TU CONFIGURACIÓN DE FIREBASE ===
    const firebaseConfig = {
        apiKey: "AIzaSyC7KCyzUCYtsE0S4exyDuhMnedRoqJVSyA",
        authDomain: "my-web-11fc4.firebaseapp.com",
        projectId: "my-web-11fc4",
        storageBucket: "my-web-11fc4.firebasestorage.app",
        messagingSenderId: "54023141783",
        appId: "1:54023141783:web:e3c93ed9de1a8187c96cd2",
        measurementId: "G-KV1QDZ7QQP"
    };

    // === INICIALIZAR ===
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // === MANEJO DEL FORMULARIO ===
    const formulario = document.getElementById('miFormulario');
    const mensajeEstado = document.getElementById('mensajeEstado');

    formulario.addEventListener('submit', async function(evento) {
        evento.preventDefault();

        const botonEnviar = formulario.querySelector('.btn-enviar');
        botonEnviar.disabled = true;
        botonEnviar.textContent = 'Enviando...';

        const datos = {
            nombre: formulario.nombre.value.trim(),
            apellido: formulario.apellido.value.trim(),
            direccion: formulario.direccion.value.trim(),
            cedula: formulario.cedula.value.trim(),
            nacionalidad: formulario.nacionalidad.value.trim(),
            fecha: serverTimestamp()
        };

        try {
            await addDoc(collection(db, "registros"), datos);
            mensajeEstado.className = 'exito';
            mensajeEstado.style.display = 'block';
            mensajeEstado.textContent = '¡Registro guardado correctamente!';
            formulario.reset();
        } catch (error) {
            mensajeEstado.className = 'error';
            mensajeEstado.style.display = 'block';
            mensajeEstado.textContent = 'Error: ' + error.message;
        } finally {
            botonEnviar.disabled = false;
            botonEnviar.textContent = 'Enviar';
        }
    });

    formulario.addEventListener('reset', () => {
        mensajeEstado.style.display = 'none';
    });
</script>
</body>
</html>
